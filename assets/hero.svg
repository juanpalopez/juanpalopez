<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" role="img" aria-label="Juan Pablo Lopez — Senior Software Engineer at Trade Republic, London. Distributed systems, Kotlin, Kafka, Kubernetes.">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.name{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:800;font-size:58px;fill:#f0f6fc;letter-spacing:-1.5px}
.muted{fill:#8b949e}.typed{font-size:22px;fill:#e6edf3}
.blink{animation:blink 1s step-end infinite}
.ev{animation:flow linear infinite}
@keyframes blink{50%{opacity:0}}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(980px)}}
@keyframes show{0%{opacity:1}33.33%{opacity:0}100%{opacity:0}}
.p0{animation:show 12s step-end infinite;animation-delay:0s;opacity:0}
.c0{animation:type0 12s infinite;animation-delay:0s}
@keyframes type0{0%{transform:translateX(0);animation-timing-function:steps(52)}11%{transform:translateX(686.4px)}100%{transform:translateX(686.4px)}}
.p1{animation:show 12s step-end infinite;animation-delay:4s;opacity:0}
.c1{animation:type1 12s infinite;animation-delay:4s}
@keyframes type1{0%{transform:translateX(0);animation-timing-function:steps(43)}11%{transform:translateX(567.6px)}100%{transform:translateX(567.6px)}}
.p2{animation:show 12s step-end infinite;animation-delay:8s;opacity:0}
.c2{animation:type2 12s infinite;animation-delay:8s}
@keyframes type2{0%{transform:translateX(0);animation-timing-function:steps(41)}11%{transform:translateX(541.2px)}100%{transform:translateX(541.2px)}}
@media (prefers-reduced-motion:reduce){.ev,.blink{animation:none}}
</style>
<defs>
  <clipPath id="r"><rect width="900" height="360" rx="18"/></clipPath>
  <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#0d1117"/><stop offset=".12" stop-color="#0d1117" stop-opacity="0"/><stop offset=".88" stop-color="#0d1117" stop-opacity="0"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <radialGradient id="glow" cx=".85" cy="0" r=".9"><stop offset="0" stop-color="#3ddc97" stop-opacity=".16"/><stop offset="1" stop-color="#3ddc97" stop-opacity="0"/></radialGradient>
</defs>
<g clip-path="url(#r)">
  <rect width="900" height="360" fill="#0d1117"/>
  <rect width="900" height="190" fill="url(#glow)"/>
