name: Update profile stats

on:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/stats.yml"]
  schedule:
    - cron: "17 5 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render stats card
        env:
          # Optional: add a personal access token (scope: read:user) as the repo
          # secret METRICS_TOKEN to break private work down by type as well.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
        run: python3 scripts/stats.py "${{ github.repository_owner }}"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || git commit -m "Update profile stats"
          git push
